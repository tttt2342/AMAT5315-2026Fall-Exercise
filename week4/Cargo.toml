[package]
name = "continuum"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "field"
path = "src/bin/field.rs"

[[bin]]
name = "fluid"
path = "src/bin/fluid.rs"

[[bin]]
name = "measure-rk4"
path = "scripts/measure_rk4.rs"

[[bin]]
name = "line-pulse"
path = "scripts/simulate_line_pulse.rs"

[[bin]]
name = "line-accuracy"
path = "scripts/line_accuracy.rs"
