[package]
name = "seismic"
version = "0.1.0"
edition = "2024"
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
[[bin]]
name = "seismic"
path = "src/main.rs"
test = false
