[package]
name = "md"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
    "ttf",
] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.profiling]
inherits = "release"
debug = 2
split-debuginfo = "off"
strip = "none"
